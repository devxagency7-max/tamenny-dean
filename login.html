<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tamenny — Faculty Dean Academic Observability & Clinical Audit Portal Login">
  <title>Login — Faculty Dean Portal | Tamenny</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logo-icon.png">

  <!-- Login Stylesheet -->
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-body">

  <div class="login-container">
    <div class="login-card">

      <div class="logo-container">
        <img src="assets/images/logo.png" alt="Tamenny">
      </div>

      <h1 class="login-title">Faculty Dean Portal</h1>
      <p class="login-subtitle">Academic Observatory — Tamenny</p>

      <form id="deanLoginForm" class="login-form">

        <!-- Email Field -->
        <div class="input-group">
          <label for="deanEmail">Academic Email</label>
          <div class="input-wrapper">
            <i class="bx bx-envelope"></i>
            <input type="email" id="deanEmail" placeholder="dean.pharmacy@cu.edu.eg"
              value="dean.pharmacy@cu.edu.eg" required autocomplete="username">
          </div>
        </div>

        <!-- Password Field -->
        <div class="input-group">
          <label for="deanPassword">Password</label>
          <div class="input-wrapper">
            <i class="bx bx-lock-alt"></i>
            <input type="password" id="deanPassword" placeholder="••••••••••••"
              value="TamennyDean@2026" required autocomplete="current-password">
          </div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn-login" id="loginSubmitBtn">Sign In to Observatory</button>
      </form>

      <div class="login-footer">
        <span>Developed by</span>
        <a href="https://devsmartx.com" target="_blank" rel="noopener" class="devx-link" title="DevX Systems">
          <img src="assets/images/devx_logo.jpeg" alt="DevX" class="devx-logo">
        </a>
      </div>

    </div>
  </div>

  <!-- Toast Container -->
  <div id="loginToast" class="login-toast"></div>

  <!-- Login Logic -->
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
